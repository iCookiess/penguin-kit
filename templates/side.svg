<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 160" width="240" height="640">
  <!-- Вещь рядом с пингвином. Стоит на полу (пунктир, y = 151), рисуйте в рамке 60×160. На сайте она стоит слева от пингвина и уменьшена до 80 %. -->
  <!-- Группа guide — линия пола, на сайт не попадает. -->
  <g id="guide"><path d="M0 151 H60" stroke="#999" stroke-dasharray="2 2"/></g>
  <g id="body"></g>
</svg>
